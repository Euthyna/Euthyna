# Example experiment spec. `euthyna experiment plan experiments/example.yaml`
#
# Two arms are added for you unless you decline them, because a result without either
# is not readable:
#   raw_trajectory — retrieving the raw trace instead of a distilled skill. Published
#                    work reports this baseline can WIN, so omitting it makes a
#                    positive result meaningless.
#   aa_sham        — byte-identical to the control. Its discordant rate is the noise
#                    floor; an arm at or below it is noise whatever its p-value.
