[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "euthyna"
dynamic = ["version"]
description = "Euthyna — agent-runtime control plane: a local bump-in-the-wire gateway that meters task-total LLM cost with native cache categories, diagnoses agent behavior from traces, and intervenes only with evidence. Nothing in excess; know thyself."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent", "control-plane", "llm", "cost", "observability", "opencode", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=5.4", "aiohttp>=3.9"]

[project.urls]
Repository = "https://github.com/Euthyna/Euthyna"
Issues = "https://github.com/Euthyna/Euthyna/issues"
Changelog = "https://github.com/Euthyna/Euthyna/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23"]
lint = ["ruff>=0.4"]

[project.scripts]
euthyna = "euthyna.cli.main:main"

[tool.setuptools]
packages = ["euthyna", "euthyna.core", "euthyna.core.adapters", "euthyna.gateway", "euthyna.cli", "euthyna.skills", "euthyna.experiment"]

[tool.setuptools.dynamic]
version = { attr = "euthyna.version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = [
    "euthyna/core",
    "tests/test_accountant.py",
    "tests/test_adapters.py",
    "tests/test_transforms.py",
    "tests/test_verifier.py",
]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly so new ruff releases don't change what CI enforces.
# Deliberate non-goals: BLE (broad excepts ARE the fail-open contract),
# DTZ (local-day ledger files are by design).
select = ["E4", "E7", "E9", "F"]
